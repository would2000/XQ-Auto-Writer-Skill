name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r .agents/skills/xq-xscript-compiler/scripts/requirements.txt

      - name: Validate release metadata
        run: python scripts/check_release_metadata.py

      - name: Validate repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Validate release-candidate interface
        run: python scripts/check_release_candidate.py

      - name: Rehearse Skill upgrade and rollback
        run: python scripts/rehearse_upgrade_rollback.py

      - name: Run unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Compile Python sources
        shell: pwsh
        run: |
          $skillScripts = Get-ChildItem .agents/skills/xq-xscript-compiler/scripts -Filter *.py
          python -m py_compile $skillScripts.FullName scripts/check_release_metadata.py scripts/check_repository_hygiene.py scripts/check_release_candidate.py scripts/release_maintenance.py scripts/rehearse_upgrade_rollback.py

      - name: Verify submodule state
        shell: pwsh
        run: |
          $submoduleState = git submodule status --recursive
          if ($LASTEXITCODE -ne 0 -or $submoduleState -match '(?m)^[+\-U]') {
            $submoduleState
            throw 'Submodule checkout is missing, conflicted, or not at the recorded commit.'
          }
          $submoduleState

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          ## XQ Auto Writer CI

          - Release metadata, repository hygiene, frozen RC interface, upgrade/rollback rehearsal, unit tests, Python syntax and submodule state run in this job.
          - XQ UI compilation: **Unable to Test（未驗證）**. This hosted runner does not have a signed-in interactive XQ desktop.
          - A green job does not prove trading profitability, safety, or readiness for live trading.
          '@
